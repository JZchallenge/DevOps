name: CI devops 2025

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run tests
        run: |
          mvn -B verify \
            --file ./Part1/TP/backend/pom.xml

  sonar:
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: SonarCloud analysis
        run: |
          mvn -B sonar:sonar \
            -Dsonar.projectKey=JZchallenge_DevOps \
            -Dsonar.organization=jzchallenge \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            --file ./Part1/TP/backend/pom.xml

  build-and-push-docker-image:
    needs: sonar
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - context: ./Part1/TP/backend
            image: tp-devops-simple-api
          - context: ./Part1/TP/database
            image: tp-devops-database
          - context: ./Part1/TP/httpd
            image: tp-devops-httpd
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          push: ${{ github.ref == 'refs/heads/main' }}